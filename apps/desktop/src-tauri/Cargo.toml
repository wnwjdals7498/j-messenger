[package]
name = "j-messenger-desktop"
version = "0.2.0"
description = "J Messenger Windows desktop client"
authors = []
edition = "2021"

[lib]
name = "j_messenger_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
tauri = { version = "=2.12.1", features = [] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
tokio = { version = "=1.53.2", features = ["fs", "macros", "rt-multi-thread", "sync"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
keyring = { version = "=4.2.0", features = ["v1"] }
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
futures-util = "=0.3.34"
