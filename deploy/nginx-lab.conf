user nginx;
worker_processes auto;
pid /run/nginx.pid;
# App requests are logged once by the backend's metadata-only JSON logger.
# Nginx's native request/error formats may expose URI arguments and credentials.
error_log /dev/null;
include /usr/share/nginx/modules/*.conf;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    map $http_upgrade $jm_connection {
        default upgrade;
        '' close;
    }
    server {
        listen 10.77.0.10:443 ssl;
        server_name 10.77.0.10;
        ssl_certificate /etc/nginx/j-messenger-lab/service.crt;
        ssl_certificate_key /etc/nginx/j-messenger-lab/service.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 5065536;
        if ($host != '10.77.0.10') { return 421; }
        location / {
            proxy_pass https://127.0.0.1:3443;
            proxy_ssl_trusted_certificate /etc/nginx/j-messenger-lab/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name j-messenger-lab;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $jm_connection;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 30s;
        }
    }
}
